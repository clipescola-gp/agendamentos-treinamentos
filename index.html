<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treinamento ClipEscola – Agendamento</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#22367b;--blue2:#1a2d6b;--yellow:#ffca26;--light:#d3e2f2;--gray:#5a6074;--bg:#f5f7fb;--radius:12px}
body{font-family:Nunito,sans-serif;background:var(--bg);color:var(--blue);min-height:100vh}
/* Header */
.hdr{background:var(--blue);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:relative}
.hdr img{height:36px;object-fit:contain}
.badge{background:rgba(255,202,38,.15);border:1px solid rgba(255,202,38,.4);color:var(--yellow);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
/* Hero */
.hero{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);padding:48px 32px 56px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,202,38,.07);top:-80px;right:-60px}
.hero-tag{display:inline-block;background:rgba(255,202,38,.15);border:1px solid rgba(255,202,38,.35);color:var(--yellow);font-size:12px;font-weight:700;padding:5px 16px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px}
.hero h1{color:#fff;font-size:28px;font-weight:800;margin-bottom:4px}
.hero .hero-sub{color:rgba(255,255,255,.6);font-size:14px;margin-bottom:10px}
.hero p{color:rgba(255,255,255,.75);font-size:15px;max-width:480px;margin:0 auto 20px}
.hero-meta{display:inline-flex;align-items:center;gap:16px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:8px 20px;color:#fff;font-size:13px;font-weight:700}
.hero-steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:20px}
.hero-step{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:30px;padding:7px 16px;color:rgba(255,255,255,.85);font-size:12px;font-weight:700}
.hs-n{background:var(--yellow);color:var(--blue);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
/* Booking */
.wrap{max-width:680px;margin:0 auto;padding:28px 16px}
.card{background:#fff;border:1px solid var(--light);border-radius:var(--radius);padding:28px;margin-bottom:20px;box-shadow:0 4px 24px rgba(34,54,123,.08)}
.card h2{font-size:17px;font-weight:800;margin-bottom:20px;color:var(--blue)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form-group.full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:700;color:var(--gray);margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}
input[type=text],input[type=email],input[type=tel]{width:100%;padding:10px 13px;border-radius:8px;border:1.5px solid var(--light);background:var(--bg);color:var(--blue);font-size:14px;font-family:Nunito,sans-serif;outline:none;transition:border .2s}
input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus{border-color:var(--blue)}
.btn{display:inline-block;padding:12px 28px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:Nunito,sans-serif;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:#fff;color:var(--blue);border:1.5px solid var(--light)}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--light);font-size:14px}
.summary-row:last-child{border-bottom:none}
.summary-row span:first-child{color:var(--gray);font-weight:600}
.alert-box{background:#fffbea;border:1px solid rgba(255,202,38,.5);border-radius:8px;padding:12px 16px;font-size:13px;color:#92400e;margin-bottom:16px}
.error-box{background:#fde8e8;border:1px solid #f8b4b4;border-radius:8px;padding:12px 16px;font-size:13px;color:#9b1c1c;margin-top:12px}
.success-card{text-align:center;padding:48px 32px}
.success-icon{width:64px;height:64px;border-radius:50%;background:#def7ec;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:28px}
.success-card h2{font-size:22px;font-weight:800;margin-bottom:10px;color:#057a55}
.success-card .sub{color:var(--gray);font-size:14px;line-height:1.7;margin-bottom:24px}
.meet-link-box{background:var(--bg);border:1.5px solid var(--light);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--gray);word-break:break-all;margin-bottom:20px;text-align:left}
.meet-link-box strong{display:block;margin-bottom:4px;color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.new-btn{background:none;border:1.5px solid var(--light);color:var(--gray);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:Nunito,sans-serif}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:300;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.form-row{grid-template-columns:1fr}.form-group.full{grid-column:auto}.hero h1{font-size:22px}.wrap{padding:20px 12px}.card{padding:16px}}
</style>
</head>
<body>

<div class="hdr">
  <img src="https://i.imgur.com/IVPOWqc.png" alt="ClipEscola" onerror="this.style.display='none'">
  <div class="badge">Treinamento</div>
</div>

<div id="view-public">
  <div class="hero">
    <div class="hero-tag">Agendamentos ClipEscola</div>
    <h1>Treinamento ClipEscola</h1>
    <div class="hero-sub">Equipe de Customer Success</div>
    <p>Escolha o melhor horário e nossa equipe estará pronta para iniciar sua jornada com a ClipEscola.</p>
    <div class="hero-meta">🕐 2 horas &nbsp;·&nbsp; 🌎 Horário de Brasília</div>
    <div class="hero-steps">
      <div class="hero-step"><span class="hs-n">1</span><span>Preencha seus dados</span></div>
      <div class="hero-step"><span class="hs-n">2</span><span>Escolha data e horário</span></div>
      <div class="hero-step"><span class="hs-n">3</span><span>Confirme o agendamento</span></div>
    </div>
  </div>
  <div id="stepsBar" style="background:#fff;border-bottom:1px solid var(--light);padding:16px 32px;display:flex;align-items:center;justify-content:center;gap:0"></div>
  <div class="wrap"><div id="content"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Endpoints ─────────────────────────────────────────────────────────────────
// Configure a URL do n8n via parâmetro: ?n8n=https://n8n.clipescola.com.br
// Ou edite diretamente abaixo:
var N8N_BASE = (new URLSearchParams(window.location.search).get('n8n') || 'https://n8n.clipescola.com.br').replace(/\/$/,'');
var WEBHOOK_CHECK = N8N_BASE + '/webhook/verificar-disponibilidade';
var WEBHOOK_BOOK  = N8N_BASE + '/webhook/agendar-implantacao';
var DURATION = 120;

// ── Globals ───────────────────────────────────────────────────────────────────
var DAYS_PT   = ["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];
var MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var step=1, form={school:'',contact:'',email:'',phone:'',guests:''}, chosen=null, meetUrl='', availSlots=[];

// ── Utils ─────────────────────────────────────────────────────────────────────
function pad(n){return String(n).padStart(2,"0");}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function fmtDate(d){return d.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo',weekday:'long',day:'2-digit',month:'long'});}
function fmtTime(d){return d.toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'});}
function addMin(d,m){return new Date(d.getTime()+m*60000);}
function gv(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},2500);}

// ── Steps bar ─────────────────────────────────────────────────────────────────
function renderSteps(){
  var items=[['1','Dados'],['2','Horário'],['3','Confirmação']];var html='';
  for(var i=0;i<items.length;i++){
    var n=items[i][0],l=items[i][1],s=i+1;
    var numStyle=s<step?'background:#057a55;border-color:#057a55;color:#fff':s===step?'background:var(--blue);border-color:var(--blue);color:#fff':'';
    var textColor=s<step?'color:#057a55':s===step?'color:var(--blue)':'color:var(--gray)';
    html+=(i?'<div style="width:32px;height:2px;background:var(--light);margin:0 4px"></div>':'')
      +'<div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;'+textColor+'">'
      +'<div style="width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;'+numStyle+'">'+(s<step?'✓':n)+'</div>'+l+'</div>';
  }
  document.getElementById('stepsBar').innerHTML=html;
}

// ── Step 1: Dados ─────────────────────────────────────────────────────────────
function renderStep1(){
  document.getElementById('content').innerHTML=
    "<div class='card'><h2>Dados da instituição</h2><div class='form-row'>"
    +"<div class='form-group full'><label>Nome da Instituição *</label><input type='text' id='fs' placeholder='Ex: Escola Estadual São José' value='"+esc(form.school)+"'></div>"
    +"<div class='form-group'><label>Responsável *</label><input type='text' id='fc' placeholder='Nome completo' value='"+esc(form.contact)+"'></div>"
    +"<div class='form-group'><label>Telefone *</label><input type='tel' id='fp' placeholder='(48) 9 9999-9999' value='"+esc(form.phone)+"'></div>"
    +"<div class='form-group full'><label>E-mail do responsável *</label><input type='email' id='fe' placeholder='responsavel@escola.edu.br' value='"+esc(form.email)+"'></div>"
    +"<div class='form-group full'><label>Convidados adicionais <span style='text-transform:none;letter-spacing:0;font-weight:400'>(e-mails separados por vírgula)</span></label><input type='text' id='fg' placeholder='email1@ex.com, email2@ex.com' value='"+esc(form.guests)+"'></div>"
    +"</div>"
    +"<div style='margin-top:8px;padding:10px 14px;background:#fffbea;border:1px solid rgba(255,202,38,.4);border-radius:8px;font-size:13px;color:#92400e'>Reunião de Treinamento — duração de "+DURATION+" minutos via Google Meet</div>"
    +"<div style='margin-top:20px'><button class='btn btn-primary' onclick='goStep2()'>Ver horários disponíveis →</button></div></div>";
}

// ── Step 2: Horário ───────────────────────────────────────────────────────────
async function goStep2(){
  form={school:gv('fs'),contact:gv('fc'),email:gv('fe'),phone:gv('fp'),guests:gv('fg')};
  if(!form.school||!form.contact||!form.email||!form.phone){toast('Preencha todos os campos obrigatórios.');return;}
  if(!form.email.includes('@')){toast('Informe um e-mail válido.');return;}
  step=2;renderSteps();
  document.getElementById('content').innerHTML="<div class='card'><h2>Escolha um horário</h2><p style='font-size:13px;color:var(--gray);margin-bottom:8px'>Verificando disponibilidade…</p><div style='display:flex;justify-content:center;padding:20px 0'><div style='width:36px;height:36px;border:3px solid var(--light);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite'></div></div></div>";
  try{
    var r=await fetch(WEBHOOK_CHECK,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    var text=await r.text();if(!text||!text.trim())throw new Error('empty');
    var data=JSON.parse(text);if(!data.success)throw new Error('erro');
    availSlots=(data.days||[]).flatMap(function(d){
      return(d.slots||[]).map(function(s){
        return{datetime:d.date+'T'+s.time+':00-03:00',csmId:s.csmId,csmName:s.csmName,csmEmail:s.csmEmail};
      });
    });
    if(!availSlots.length)throw new Error('vazio');
  }catch(e){
    document.getElementById('content').innerHTML="<div class='card'><h2>Escolha um horário</h2><div class='alert-box'>Nenhum horário disponível nos próximos 60 dias. Entre em contato conosco.</div><button class='btn btn-secondary' onclick='goBack1()'>← Voltar</button></div>";
    return;
  }
  renderStep2();
}

function goBack1(){step=1;renderSteps();renderStep1();}

function renderStep2(){
  document.getElementById('content').innerHTML="<div class='card'><h2>Escolha um horário</h2>"
    +"<p style='font-size:12px;color:var(--gray);margin:-8px 0 16px;display:flex;align-items:center;gap:5px'>"
    +"<span style='width:8px;height:8px;border-radius:50%;background:#10ccea;display:inline-block'></span>"
    +"Horários no fuso de Brasília (UTC-3)</p>"
    +buildCalendarHTML(availSlots)
    +"<div style='margin-top:8px'><button class='btn btn-secondary' onclick='goBack1()'>← Voltar</button></div></div>";
}

function buildCalendarHTML(slots){
  var byMonth={};
  for(var i=0;i<slots.length;i++){
    var s=slots[i];var dt=new Date(s.datetime);
    var mk=dt.getFullYear()+'-'+pad(dt.getMonth()+1);
    if(!byMonth[mk])byMonth[mk]={year:dt.getFullYear(),month:dt.getMonth(),slots:[]};
    byMonth[mk].slots.push({dt:dt,idx:i});
  }
  var html='';var mkeys=Object.keys(byMonth).sort();
  for(var mi=0;mi<mkeys.length;mi++){
    var mk2=mkeys[mi];var g=byMonth[mk2];
    var firstDay=new Date(g.year,g.month,1).getDay();
    var daysInM=new Date(g.year,g.month+1,0).getDate();
    var slotMap={};
    for(var si=0;si<g.slots.length;si++){var ss=g.slots[si];var dd=ss.dt.getDate();if(!slotMap[dd])slotMap[dd]=[];slotMap[dd].push(ss);}
    var headers='';
    for(var di=0;di<DAYS_PT.length;di++){headers+='<div style="text-align:center;font-size:11px;font-weight:700;color:var(--gray);padding:4px 0">'+DAYS_PT[di]+'</div>';}
    var grid='';for(var ei=0;ei<firstDay;ei++)grid+='<div></div>';
    for(var n2=1;n2<=daysInM;n2++){
      var ds=slotMap[n2]||[];
      if(!ds.length){grid+='<div style="min-height:52px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;color:#c0c8d8;font-weight:600">'+n2+'</div>';}
      else{
        var times='';
        for(var ti=0;ti<ds.length;ti++){var ts2=ds[ti];times+='<button onclick="selectSlot('+ts2.idx+')" style="display:block;width:100%;padding:2px 0;border:none;background:none;cursor:pointer;font-size:11px;font-weight:700;color:#1a56db;font-family:Nunito,sans-serif;border-radius:4px">'+fmtTime(ts2.dt)+'</button>';}
        grid+='<div style="min-height:52px;border-radius:8px;background:#e8f0fe;border:1.5px solid #c5d8f8;padding:4px 3px"><div style="text-align:center;font-size:12px;font-weight:800;color:var(--blue);margin-bottom:2px">'+n2+'</div>'+times+'</div>';
      }
    }
    html+='<div style="margin-bottom:28px"><div style="font-weight:800;font-size:15px;color:var(--blue);margin-bottom:12px">'+MONTHS_PT[g.month]+' '+g.year+'</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">'+headers+'</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">'+grid+'</div></div>';
  }
  return html;
}

// ── Step 3: Confirmação ───────────────────────────────────────────────────────
function selectSlot(i){
  chosen=availSlots[i];step=3;renderSteps();
  var dt=new Date(chosen.datetime),end=addMin(dt,DURATION);
  var rows=[['Instituição',form.school],['Responsável',form.contact],['E-mail',form.email],['Telefone',form.phone]];
  if(form.guests)rows.push(['Convidados',form.guests]);
  rows.push(['Data',fmtDate(dt)],['Horário',fmtTime(dt)+' – '+fmtTime(end)],['Duração',DURATION+' minutos'],['CSM responsável',chosen.csmName]);
  var rh='';for(var ri=0;ri<rows.length;ri++){rh+='<div class="summary-row"><span>'+rows[ri][0]+'</span><span>'+esc(String(rows[ri][1]))+'</span></div>';}
  document.getElementById('content').innerHTML="<div class='card'><h2>Confirmar agendamento</h2><div style='margin-bottom:20px'>"+rh+"</div><div class='alert-box'>Ao confirmar, você receberá um convite do Google Calendar com o link da reunião.</div><div id='err3'></div><div style='display:flex;gap:10px;flex-wrap:wrap'><button class='btn btn-secondary' onclick='step=2;renderSteps();renderStep2()'>← Voltar</button><button class='btn btn-primary' id='btnC' onclick='confirmar()'>Confirmar agendamento ✓</button></div></div>";
}

async function confirmar(){
  var btn=document.getElementById('btnC');btn.disabled=true;btn.textContent='Confirmando…';
  try{
    var payload={school:form.school,contact:form.contact,email:form.email,phone:form.phone,guests:form.guests,
      date:chosen.datetime.split('T')[0],time:chosen.datetime.split('T')[1].slice(0,5),
      csmEmail:chosen.csmEmail,csmName:chosen.csmName};
    var r=await fetch(WEBHOOK_BOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    var text=await r.text();if(!text||!text.trim())throw new Error('Sem resposta do servidor.');
    var data=JSON.parse(text);if(!data.success)throw new Error(data.error||'Erro no servidor');
    meetUrl=data.meetLink||'';renderSuccess();
  }catch(e){
    btn.disabled=false;btn.textContent='Confirmar agendamento ✓';
    document.getElementById('err3').innerHTML='<div class="error-box">Erro: '+esc(e.message)+'</div>';
  }
}

// ── Success ───────────────────────────────────────────────────────────────────
function renderSuccess(){
  var dt=new Date(chosen.datetime),end=addMin(dt,DURATION);
  document.getElementById('stepsBar').style.display='none';
  var mh='';
  if(meetUrl){
    mh="<div class='meet-link-box'><strong>Link da reunião</strong><div style='display:flex;align-items:center;gap:8px;margin-top:4px'>"
      +"<span style='flex:1;word-break:break-all;font-size:13px;color:var(--blue)'>"+esc(meetUrl)+"</span>"
      +"<button onclick=\"navigator.clipboard.writeText('"+meetUrl+"').then(function(){this.textContent='Copiado!';var s=this;setTimeout(function(){s.textContent='Copiar'},2000)}.bind(this))\" style='flex-shrink:0;padding:6px 14px;border-radius:6px;border:1.5px solid var(--light);background:#fff;color:var(--blue);font-weight:700;font-size:12px;cursor:pointer;font-family:Nunito,sans-serif'>Copiar</button></div></div>";
  }
  document.getElementById('content').innerHTML="<div class='success-card card'>"
    +"<div class='success-icon'>🎉</div><h2>Agendamento confirmado!</h2>"
    +"<p class='sub'><strong>"+esc(form.school)+"</strong><br>"+fmtDate(dt)+"<br>"+fmtTime(dt)+" – "+fmtTime(end)+"<br>CSM responsável: <strong>"+esc(chosen.csmName)+"</strong><br>Um convite foi enviado para <strong>"+esc(form.email)+"</strong></p>"
    +mh
    +"<div style='background:#fffbea;border:1px solid rgba(255,202,38,.4);border-radius:8px;padding:12px 16px;font-size:13px;color:#92400e;text-align:left;margin-bottom:20px'>"
    +"<strong>Lembre-se:</strong> Acesse a reunião pelo computador, com microfone e fone de ouvido. Tolerância de 15 minutos de atraso. Em caso de imprevisto, entre em contato para reagendar.</div>"
    +"<button class='new-btn' onclick='resetAll()'>Fazer novo agendamento</button></div>";
}

function resetAll(){
  step=1;form={school:'',contact:'',email:'',phone:'',guests:''};chosen=null;meetUrl='';availSlots=[];
  document.getElementById('stepsBar').style.display='';renderSteps();renderStep1();
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',function(){
  renderSteps();renderStep1();
});
</script>
</body>
</html>
